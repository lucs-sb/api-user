networks:
  api_network:
    driver: bridge

services:
  postgres:
    image: postgres:latest
    container_name: api-db
    networks:
      - api_network
    environment:
      POSTGRES_DB: api-user
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - api_db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  user-api:
    build:
      context: .
      dockerfile: User.Api/Dockerfile
    container_name: user-api
    networks:
      - api_network
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Pooling=true;Database=api-user;Username=admin;Password=admin"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  api_db_data: